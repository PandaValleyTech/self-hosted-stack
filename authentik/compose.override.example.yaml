# Optional: keep data on an NFS share instead of ./data. Copy to
# compose.override.yaml (gitignored) and adjust the server and export paths.
#
# Compose merges service volumes by container path, so each entry below
# replaces the matching ./data bind mount from compose.yaml. Drop the entries
# you want to keep local. Postgres over NFS is sensitive to locking and fsync
# behaviour: use NFSv4 with hard mounts, or keep it local and rely on dumps.
#
# The exports must be writable by the container users (Authentik 1000,
# Postgres 70 on alpine); watch out for root_squash. Volume options are fixed
# when the volume is created: after changing them, `docker compose down` and
# `docker volume rm <project>_<volume>` before the next `up`.
services:
  postgresql:
    volumes:
      - authentik-postgres:/var/lib/postgresql/data

  server:
    volumes:
      - authentik-data:/data
      - authentik-templates:/templates

  worker:
    volumes:
      - authentik-data:/data
      - authentik-certs:/certs
      - authentik-templates:/templates

volumes:
  authentik-postgres:
    driver: local
    driver_opts:
      type: nfs
      o: &nfs-opts addr=nas.example.lan,nfsvers=4.1,rw,hard
      device: ":/export/authentik/postgres"
  authentik-data:
    driver: local
    driver_opts:
      type: nfs
      o: *nfs-opts
      device: ":/export/authentik/data"
  authentik-certs:
    driver: local
    driver_opts:
      type: nfs
      o: *nfs-opts
      device: ":/export/authentik/certs"
  authentik-templates:
    driver: local
    driver_opts:
      type: nfs
      o: *nfs-opts
      device: ":/export/authentik/templates"
