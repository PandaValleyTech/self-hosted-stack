# Host-specific stream ports. Copy to compose.override.yaml (gitignored);
# Compose merges it automatically and appends these to the base ports.
services:
  app:
    ports:
      - "5432:5432" # PostgreSQL
    # Optional: keep data on an NFS share instead of ./data. Volumes are merged
    # by container path, so these replace the matching bind mounts. Uncomment
    # together with the top-level volumes block below. See
    # gitea/compose.override.example.yaml for caveats.
