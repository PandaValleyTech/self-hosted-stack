# Authentik forward auth: server-level endpoints.
# Include at the top of a proxy host's Advanced config, alongside a custom
# `location /` that includes authentik-location.conf. See snippets/README.md.
# Based on https://docs.goauthentik.io/add-secure-apps/providers/proxy/server_nginx/

# Authentik's headers can exceed nginx's default buffer size.
proxy_buffers 8 16k;
proxy_buffer_size 32k;

port_in_redirect off;

# Outpost endpoints must be reachable without authentication.
location /outpost.goauthentik.io {
    # Embedded outpost runs inside authentik-server. The hostname must be a
    # variable so nginx re-resolves it at runtime; a literal name is resolved
    # once at startup (and shadows other hosts proxying to the same name),
    # which breaks when the container is recreated with a new IP.
    set $authentik_upstream authentik-server;
    proxy_pass              http://$authentik_upstream:9000;
    proxy_set_header        Host $host;
    proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
    add_header              Set-Cookie $auth_cookie;
    auth_request_set        $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
}

# A 401 from the auth endpoint starts the SSO flow.
location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}
