# Postgres sits on a private network only. Gitea also joins the shared
# network so NPM can reach gitea:3000. Git over SSH is published directly.
services:
  server:
    image: docker.gitea.com/gitea:1.26.1
    container_name: gitea
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      TZ: ${TZ:-Etc/UTC}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: 22
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-postgresql:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASS:?database password required}
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - ./data/gitea:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      - backend

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: gitea-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASS:?database password required}
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - backend

networks:
  default:
    name: ${APP_NETWORK:-apps}
    external: true
  backend:
